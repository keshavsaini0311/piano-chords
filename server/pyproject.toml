[project]
name = "piano-chords-server"
version = "0.1.0"
description = "Local server: YouTube audio, chord detection, lyrics"
requires-python = ">=3.12"
dependencies = [
    "ctc-forced-aligner==1.0.2",
    "demucs==4.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.7.0",
    "librosa>=1.0.0",
    "lv-chordia>=1.1.0",
    "unidecode>=1.3",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# demucs 4.1.0 pins numpy<2 on Intel Macs, which conflicts with librosa 1.0; this app runs on Apple silicon (and Linux)
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]
