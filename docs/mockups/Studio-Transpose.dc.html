<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio: key menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pc" data-theme="{{theme}}" style="width:560px;height:660px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;overflow:hidden">
<div style="display:flex;align-items:center;gap:8px">
<button class="btn" aria-expanded="true" style="border-color:var(--fg)">Key <b class="mono">{{keyShort}}</b><span class="muted mono" style="font-size:12px">Fm {{semiLabel}}</span></button>
<span class="muted" style="font-size:12px">Changes the display only. Your edits stay in the original key.</span>
</div>
<div class="card" style="flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 16px 40px rgba(0,0,0,.16)">
<div style="display:grid;grid-template-columns:64px 48px 1fr 92px;gap:8px;padding:0 10px" class="lbl">
<span>Key</span><span>Shift</span><span>Chords needing black keys</span><span style="text-align:right">Chords</span>
</div>
<div style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<button onClick="{{r.pick}}" style="{{r.style}}">
<span class="mono" style="font-weight:700;text-align:left">{{r.k}}</span>
<span class="mono" style="font-size:12px;text-align:left;opacity:.8">{{r.off}}</span>
<span style="display:flex;gap:3px;align-items:center"><sc-for list="{{r.bars}}" as="b" hint-placeholder-count="2"><span style="width:16px;height:8px;border-radius:2px;background:currentColor;opacity:.7"></span></sc-for><span style="font-size:12px;opacity:.8;margin-left:4px">{{r.txt}}</span></span>
<span class="mono" style="font-size:11px;text-align:right;opacity:.8;white-space:nowrap;overflow:hidden">{{r.ch}}</span>
</button>
</sc-for>
</div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line);margin-top:auto">
<span class="lbl" style="min-width:76px">Difficulty</span>
<div class="seg" role="group" aria-label="Difficulty">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3"><button aria-pressed="{{l.on}}" onClick="{{l.pick}}">{{l.n}}</button></sc-for>
</div>
<span class="muted" style="font-size:12px;width:100%">{{levelNote}}</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":560,"height":660}}'>
var NM = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var PCS = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function cp(c){ var m = /^([A-G][b#]?)(.*)$/.exec(c); return { r: PCS[m[1]], q: m[2] }; }
// level 0 = triads only, 1 = keep 7ths but drop sus/extensions, 2 = as detected
function shape(q, lv){ var minor = /^m(?!aj)/.test(q), base = minor ? 'm' : (/^dim/.test(q) ? 'dim' : '');
  if (lv === 0) return base; if (lv === 1) return /maj7/.test(q) ? 'maj7' : (/7/.test(q) ? base + '7' : base); return q; }
function tr(c, s, lv){ var p = cp(c); return NM[(p.r + s + 144) % 12] + shape(p.q, lv); }
function notesOf(c){ var p = cp(c), q = p.q, root = 53 + ((p.r + 7) % 12);
  var ns = [root, root + (/^m(?!aj)/.test(q) || /dim/.test(q) ? 3 : 4), root + (/dim/.test(q) ? 6 : 7)];
  if (/sus4/.test(q)) ns[1] = root + 5;
  if (/maj7/.test(q)) ns.push(root + 11); else if (/7/.test(q)) ns.push(root + 10);
  return ns; }
var CHORDS = ['Fm', 'Db', 'Ab', 'Eb', 'Dbmaj7', 'Eb7'];
function uniq(s, lv){ var seen = {}, out = []; CHORDS.forEach(function(c){ var t = tr(c, s, lv); if (!seen[t]) { seen[t] = 1; out.push(t); } }); return out; }
var LEVELS = ['Easy: triads', 'Medium: keep 7ths', 'As detected'];
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { semi: 4, lv: 0 }; }
  renderVals() {
    var self = this, st = this.state, cs = ((st.semi % 12) + 12) % 12, rows = [];
    for (var s = -5; s <= 6; s++) { (function(s){
      var u = uniq(s, st.lv), b = u.filter(function(t){ return notesOf(t).some(function(x){ return [1,3,6,8,10].indexOf(x % 12) >= 0; }); }).length;
      var on = ((s % 12) + 12) % 12 === cs, bars = []; for (var k = 0; k < b; k++) bars.push({});
      rows.push({ k: NM[(5 + s + 144) % 12] + 'm', off: s === 0 ? 'orig' : (s > 0 ? '+' + s : String(s)), bars: bars,
        txt: b === 0 ? 'none, all white keys' : String(b), ch: u.slice(0, 4).join(' '),
        style: 'display:grid;grid-template-columns:64px 48px 1fr 92px;gap:8px;align-items:center;min-height:34px;padding:0 10px;border-radius:9px;cursor:pointer;text-align:left;' +
          (on ? 'border:0;background:var(--cur);color:var(--on-cur);' : 'border:0;background:transparent;color:var(--fg);') + (b === 0 && !on ? 'font-weight:600;' : ''),
        pick: function(){ self.setState({ semi: s }); } }); })(s); }
    var sl = cs > 6 ? cs - 12 : cs;
    var notes = ['Every chord becomes a plain major or minor triad. Best while learning the song.', 'Keeps 7th chords (4 notes), drops sus and other extensions.', 'Exactly what the detector found, including sus and 7ths.'];
    return {
      theme: this.props.theme ?? 'auto', rows: rows,
      keyShort: NM[(5 + cs) % 12] + 'm', semiLabel: sl === 0 ? '' : (sl > 0 ? '+' + sl : String(sl)),
      levels: LEVELS.map(function(n, i){ return { n: n, on: i === st.lv ? 'true' : 'false', pick: function(){ self.setState({ lv: i }); } }; }),
      levelNote: notes[st.lv]
    };
  }
}
</script>
</body>
</html>
