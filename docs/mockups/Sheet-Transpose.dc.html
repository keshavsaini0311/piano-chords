<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheet: transpose popover</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pc" data-theme="{{theme}}" style="width:560px;height:660px;padding:20px;display:flex;flex-direction:column;gap:10px;overflow:hidden">
<div style="display:flex;justify-content:flex-end">
<button class="btn" aria-expanded="true" style="border-color:var(--fg)">Key <b class="mono">{{keyShort}}</b><span class="muted" style="font-size:12px">orig Fm</span></button>
</div>
<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:18px;box-shadow:0 16px 40px rgba(0,0,0,.16)">
<div style="display:flex;align-items:flex-end;gap:16px">
<div style="flex:1"><div class="lbl">Original</div><div style="font-size:18px;font-weight:500" class="muted">F minor</div></div>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-bottom:6px;color:var(--muted)"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
<div style="flex:1.4"><div class="lbl">Now playing in</div><div style="font-size:30px;font-weight:700;line-height:1.1">{{keyLong}}</div></div>
</div>
<div style="display:flex;align-items:center;gap:10px">
<button class="btn" onClick="{{down}}" aria-label="Down a semitone" style="width:52px;font-size:20px">−</button>
<div style="flex:1;text-align:center;padding:8px;border-radius:12px;background:var(--surface2)"><span class="mono" style="font-weight:700;font-size:20px">{{semiLabel}}</span> <span class="muted" style="font-size:13px">semitones</span></div>
<button class="btn" onClick="{{up}}" aria-label="Up a semitone" style="width:52px;font-size:20px">+</button>
<button class="btn" onClick="{{reset}}">Reset</button>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span class="lbl">Easiest keys for this song</span>
<sc-for list="{{sugg}}" as="s" hint-placeholder-count="3">
<button onClick="{{s.pick}}" style="{{s.style}}">
<span class="mono" style="font-weight:700;font-size:16px;min-width:44px;text-align:left">{{s.k}}</span>
<span class="muted mono" style="font-size:13px;min-width:32px;text-align:left">{{s.off}}</span>
<span style="flex:1;text-align:left;font-size:14px">{{s.txt}}</span>
</button>
</sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<span class="lbl">Every chord changes with it</span>
<div style="display:flex;flex-wrap:wrap;gap:6px">
<sc-for list="{{map}}" as="m" hint-placeholder-count="4"><span class="chip mono" style="font-size:13px"><span class="muted">{{m.a}}</span> → <b>{{m.b}}</b></span></sc-for>
</div>
</div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--line)">
<span class="lbl" style="margin-right:auto">Difficulty</span>
<div class="seg" role="group" aria-label="Difficulty"><button aria-pressed="{{easyP}}" onClick="{{setEasy}}">Easy: plain triads</button><button aria-pressed="{{fullP}}" onClick="{{setFull}}">Full: as detected</button></div>
<span class="muted" style="font-size:12px;width:100%">{{diffNote}}</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":560,"height":660}}'>
var NM = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var PCS = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function cp(c){ var m = /^([A-G][b#]?)(.*)$/.exec(c); return { r: PCS[m[1]], q: m[2] }; }
function simp(q){ return /^m(?!aj)/.test(q) ? 'm' : (/^dim/.test(q) ? 'dim' : ''); }
function tr(c, s, easy){ var p = cp(c); return NM[(p.r + s + 144) % 12] + (easy ? simp(p.q) : p.q); }
function notesOf(c){ var p = cp(c), q = p.q, root = 53 + ((p.r + 7) % 12);
  var ns = [root, root + (/^m(?!aj)/.test(q) || /dim/.test(q) ? 3 : 4), root + (/dim/.test(q) ? 6 : 7)];
  if (/sus4/.test(q)) ns[1] = root + 5;
  if (/maj7/.test(q)) ns.push(root + 11); else if (/7/.test(q)) ns.push(root + 10);
  return ns; }
var CHORDS = ['Fm', 'Db', 'Ab', 'Eb', 'Dbmaj7', 'Eb7'];
function uniq(s, easy){ var seen = {}, out = []; CHORDS.forEach(function(c){ var t = tr(c, s, easy); if (!seen[t]) { seen[t] = 1; out.push([c, t]); } }); return out; }
function blackCount(s, easy){ return uniq(s, easy).filter(function(p){ return notesOf(p[1]).some(function(n){ return [1,3,6,8,10].indexOf(n % 12) >= 0; }); }).length; }
function signed(s){ var x = ((s % 12) + 12) % 12; x = x > 6 ? x - 12 : x; return x; }
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { semi: 4, easy: true }; }
  renderVals() {
    var self = this, st = this.state, cur = signed(st.semi);
    var opts = [];
    for (var s = -5; s <= 6; s++) opts.push({ s: s, b: blackCount(s, st.easy) });
    opts.sort(function(a, b){ return a.b - b.b || Math.abs(a.s) - Math.abs(b.s); });
    var sugg = opts.slice(0, 3).map(function(o){
      var on = o.s === cur;
      return { k: NM[(5 + o.s + 144) % 12] + 'm', off: o.s === 0 ? '0' : (o.s > 0 ? '+' + o.s : String(o.s)),
        txt: o.b === 0 ? 'all white keys' : (o.b === 1 ? '1 chord needs a black key' : o.b + ' chords need black keys'),
        style: 'display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;cursor:pointer;color:var(--fg);' + (on ? 'border:1.5px solid var(--cur);background:var(--cur-soft);' : 'border:1px solid var(--line2);background:var(--surface);'),
        pick: function(){ self.setState({ semi: o.s }); } };
    });
    var m = uniq(st.semi, st.easy).map(function(p){ return { a: st.easy ? tr(p[0], 0, true) : p[0], b: p[1] }; });
    var seenA = {}; m = m.filter(function(x){ if (seenA[x.a]) return false; seenA[x.a] = 1; return true; });
    var k = NM[(5 + st.semi + 144) % 12];
    return {
      theme: this.props.theme ?? 'auto',
      keyShort: k + 'm', keyLong: k + ' minor',
      semiLabel: cur === 0 ? '0' : (cur > 0 ? '+' + cur : String(cur)),
      sugg: sugg, map: m,
      easyP: st.easy ? 'true' : 'false', fullP: st.easy ? 'false' : 'true',
      diffNote: st.easy ? 'Easy plays ' + tr('Dbmaj7', st.semi, false) + ' as ' + tr('Db', st.semi, false) + ' and ' + tr('Eb7', st.semi, false) + ' as ' + tr('Eb', st.semi, false) + '. Switch to Full when you are ready for 7ths.' : 'Full keeps every 7th and sus chord the detector found.',
      up: function(){ self.setState({ semi: self.state.semi + 1 }); },
      down: function(){ self.setState({ semi: self.state.semi - 1 }); },
      reset: function(){ self.setState({ semi: 0 }); },
      setEasy: function(){ self.setState({ easy: true }); },
      setFull: function(){ self.setState({ easy: false }); }
    };
  }
}
</script>
</body>
</html>
