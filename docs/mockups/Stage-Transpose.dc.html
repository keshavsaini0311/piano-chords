<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage: key wheel</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pc" data-theme="{{theme}}" style="width:560px;height:660px;padding:20px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:hidden">
<div style="width:100%;display:flex;justify-content:space-between;align-items:center">
<span style="font-size:20px;font-weight:700">Pick a key</span>
<a class="btn" href="Stage-Play.dc.html">Done</a>
</div>
<div style="position:relative;width:400px;height:400px">
<div style="position:absolute;left:44px;top:44px;width:312px;height:312px;border-radius:50%;border:1px dashed var(--line2)" aria-hidden="true"></div>
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button onClick="{{k.pick}}" style="{{k.style}}" aria-label="{{k.aria}}">
<span class="mono" style="font-size:17px;font-weight:700;line-height:1">{{k.k}}</span>
<span style="display:flex;gap:3px;min-height:6px"><sc-for list="{{k.dots}}" as="d" hint-placeholder-count="1"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75"></span></sc-for></span>
<sc-if value="{{k.orig}}" hint-placeholder-val="{{false}}"><span style="position:absolute;top:-9px;padding:1px 6px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:10px;font-weight:600">orig</span></sc-if>
</button>
</sc-for>
<div style="position:absolute;left:100px;top:110px;width:200px;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center">
<span style="font-size:32px;font-weight:700;line-height:1.05">{{keyLong}}</span>
<span class="muted mono" style="font-size:14px">{{semiLabel}} from F minor</span>
<span style="font-size:13px;font-weight:600;color:var(--cur)">{{blackTxt}}</span>
<span style="display:flex;gap:8px;margin-top:6px"><button class="btn" onClick="{{down}}" aria-label="Down a semitone" style="width:52px;font-size:20px">−</button><button class="btn" onClick="{{up}}" aria-label="Up a semitone" style="width:52px;font-size:20px">+</button></span>
</div>
</div>
<span class="muted" style="font-size:12px">Dots under a key = chords that need black keys. No dots = all white keys.</span>
<div class="seg" role="group" aria-label="Difficulty"><button aria-pressed="{{easyP}}" onClick="{{setEasy}}">Easy chords</button><button aria-pressed="{{fullP}}" onClick="{{setFull}}">Full chords</button></div>
<span class="muted" style="font-size:12px;text-align:center">{{diffNote}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":560,"height":660}}'>
var NM = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var PCS = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function cp(c){ var m = /^([A-G][b#]?)(.*)$/.exec(c); return { r: PCS[m[1]], q: m[2] }; }
function simp(q){ return /^m(?!aj)/.test(q) ? 'm' : (/^dim/.test(q) ? 'dim' : ''); }
function tr(c, s, easy){ var p = cp(c); return NM[(p.r + s + 144) % 12] + (easy ? simp(p.q) : p.q); }
function notesOf(c){ var p = cp(c), q = p.q, root = 53 + ((p.r + 7) % 12);
  var ns = [root, root + (/^m(?!aj)/.test(q) || /dim/.test(q) ? 3 : 4), root + (/dim/.test(q) ? 6 : 7)];
  if (/sus4/.test(q)) ns[1] = root + 5;
  if (/maj7/.test(q)) ns.push(root + 11); else if (/7/.test(q)) ns.push(root + 10);
  return ns; }
var CHORDS = ['Fm', 'Db', 'Ab', 'Eb', 'Dbmaj7', 'Eb7'];
function blackCount(s, easy){ var seen = {}, n = 0; CHORDS.forEach(function(c){ var t = tr(c, s, easy); if (seen[t]) return; seen[t] = 1;
  if (notesOf(t).some(function(x){ return [1,3,6,8,10].indexOf(x % 12) >= 0; })) n++; }); return n; }
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { semi: 4, easy: true }; }
  renderVals() {
    var self = this, st = this.state, cs = ((st.semi % 12) + 12) % 12;
    var keys = [];
    for (var p = 0; p < 12; p++) { (function(p){
      var s = ((p - 5) % 12 + 12) % 12, on = s === cs, b = blackCount(s, st.easy), a = (p * 30 - 90) * Math.PI / 180;
      var x = 200 + 164 * Math.cos(a) - 34, y = 200 + 164 * Math.sin(a) - 30, dots = [];
      for (var d = 0; d < b; d++) dots.push({});
      keys.push({ k: NM[p] + 'm', dots: dots, orig: p === 5, aria: NM[p] + ' minor, ' + b + ' chords need black keys',
        style: 'position:absolute;left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;width:68px;height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;' +
          (on ? 'border:0;background:var(--cur);color:var(--on-cur);box-shadow:0 6px 18px rgba(0,0,0,.18);' : b === 0 ? 'border:2px solid var(--fg);background:var(--surface);color:var(--fg);' : 'border:1px solid var(--line2);background:var(--surface);color:var(--fg);'),
        pick: function(){ self.setState({ semi: s }); } }); })(p); }
    var sl = cs > 6 ? cs - 12 : cs, b = blackCount(cs, st.easy);
    return {
      theme: this.props.theme ?? 'auto', keys: keys,
      keyLong: NM[(5 + cs) % 12] + ' minor',
      semiLabel: sl === 0 ? '0' : (sl > 0 ? '+' + sl : String(sl)),
      blackTxt: b === 0 ? 'All white keys' : (b === 1 ? '1 chord needs a black key' : b + ' chords need black keys'),
      easyP: st.easy ? 'true' : 'false', fullP: st.easy ? 'false' : 'true',
      diffNote: st.easy ? 'Easy turns ' + tr('Dbmaj7', cs, false) + ' into ' + tr('Db', cs, false) + ' and ' + tr('Eb7', cs, false) + ' into ' + tr('Eb', cs, false) + '.' : 'Full keeps the 7th chords the detector found.',
      up: function(){ self.setState({ semi: self.state.semi + 1 }); },
      down: function(){ self.setState({ semi: self.state.semi - 1 }); },
      setEasy: function(){ self.setState({ easy: true }); },
      setFull: function(){ self.setState({ easy: false }); }
    };
  }
}
</script>
</body>
</html>
