<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheet: phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pc" data-theme="{{theme}}" style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden">
<header style="display:flex;align-items:center;gap:6px;padding:8px 8px 8px 4px;background:var(--surface);border-bottom:1px solid var(--line)">
<button class="ibtn" aria-label="Back to songs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="flex:1;min-width:0;font-weight:600;font-size:16px">Pal Pal</div>
<button class="chip" onClick="{{up}}" aria-label="Key, tap to transpose">Key <b class="mono">{{keyShort}}</b></button>
<button class="ibtn" aria-label="Edit chords"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
</header>
<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px">
<div class="seg" role="group" aria-label="View"><button aria-pressed="true">Lyrics</button><button aria-pressed="false">Grid</button></div>
<div class="seg" role="group" aria-label="Difficulty"><button aria-pressed="{{easyP}}" onClick="{{setEasy}}">Easy</button><button aria-pressed="{{fullP}}" onClick="{{setFull}}">Full</button></div>
</div>
<main style="flex:1;min-height:0;overflow:hidden;padding:0 10px">
<sc-for list="{{lines}}" as="ln" hint-placeholder-count="5">
<sc-if value="{{ln.hasSec}}" hint-placeholder-val="{{false}}"><div class="lbl" style="margin:12px 0 0 10px">{{ln.sec}}</div></sc-if>
<div style="{{ln.style}}">
<sc-for list="{{ln.segs}}" as="sg" hint-placeholder-count="4">
<span style="display:inline-flex;flex-direction:column">
<button class="mono" style="{{sg.cstyle}}" onClick="{{sg.seek}}" aria-label="Jump to {{sg.c}}">{{sg.c}}</button>
<span style="font-size:17px;line-height:24px;white-space:pre-wrap">{{sg.t}}</span>
</span>
</sc-for>
</div>
</sc-for>
</main>
<section style="padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:baseline;gap:10px">
<span class="mono" style="font-size:26px;font-weight:700;color:var(--cur)">{{cur.c}}</span>
<span class="muted" style="font-size:13px">then</span>
<span class="mono" style="font-size:18px;font-weight:700;color:var(--nxt)">{{nxt.c}}</span>
<span class="muted" style="font-size:12px;margin-left:auto">swipe up for chord list</span>
</div>
<dc-import name="Keyboard" lit="{{cur.n}}" soon="{{nxt.n}}" kh="70" hint-size="100%,70px"></dc-import>
</section>
<footer class="bar" style="display:flex;flex-direction:column;gap:6px;padding:10px 14px 18px">
<div style="position:relative;height:18px" aria-hidden="true">
<div style="position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)"></div>
<div style="position:absolute;left:17%;width:23%;top:1px;height:16px;border-radius:4px;background:rgba(251,146,60,.2);border-left:2px solid #FB923C;border-right:2px solid #FB923C"></div>
<div style="position:absolute;left:0;width:{{pct}}%;top:7px;height:4px;border-radius:2px;background:var(--bar-fg)"></div>
</div>
<div style="display:flex;align-items:center;gap:8px">
<span class="mono" style="font-size:12px;min-width:44px">{{time}}</span>
<button class="ibtn" aria-pressed="true" aria-label="Loop verse" style="color:#FB923C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"></path></svg></button>
<div style="flex:1;display:flex;justify-content:center">
<button class="ibtn" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width:56px;height:56px;border-radius:50%;background:var(--bar-fg);color:var(--bar)">
<sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></sc-if>
</button>
</div>
<button class="btn" style="min-height:40px;padding:0 10px">0.75×</button>
<span class="mono muted" style="font-size:12px;min-width:36px;text-align:right">3:15</span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":390,"height":844}}'>
var NM = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var PCS = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function cp(c){ var m = /^([A-G][b#]?)(.*)$/.exec(c); return { r: PCS[m[1]], q: m[2] }; }
function simp(q){ return /^m(?!aj)/.test(q) ? 'm' : (/^dim/.test(q) ? 'dim' : ''); }
function tr(c, s, easy){ var p = cp(c); return NM[(p.r + s + 144) % 12] + (easy ? simp(p.q) : p.q); }
function notesOf(c){ var p = cp(c), q = p.q, root = 53 + ((p.r + 7) % 12);
  var ns = [root, root + (/^m(?!aj)/.test(q) || /dim/.test(q) ? 3 : 4), root + (/dim/.test(q) ? 6 : 7)];
  if (/sus4/.test(q)) ns[1] = root + 5;
  if (/maj7/.test(q)) ns.push(root + 11); else if (/7/.test(q)) ns.push(root + 10);
  return ns.join(','); }
var SONG = [
  { sec: 'Verse 1', segs: [['Fm','walking down the '],['Db','empty road to'],['Ab','night '],['Eb','']] },
  { segs: [['Fm','streetlights hum a '],['Db','song I used to '],['Ab','know '],['Eb','']] },
  { segs: [['Fm','every step I '],['Dbmaj7','take, the city '],['Ab','slows '],['Eb7','']] },
  { sec: 'Chorus', segs: [['Db','hold the moment, '],['Ab','hold it while it '],['Eb','stays']] },
  { segs: [['Fm','little by '],['Db','little the '],['Eb','night gives '],['Fm','way']] }
];
var FLAT = []; SONG.forEach(function(ln, li){ ln.segs.forEach(function(sg){ FLAT.push({ li: li, c: sg[0] }); }); });
var BASE = 'align-self:flex-start;border:0;background:transparent;padding:1px 6px;margin:0 6px 1px -6px;border-radius:6px;font-weight:700;font-size:15px;line-height:22px;min-height:24px;color:var(--fg);cursor:pointer;';
var CUR = 'background:var(--cur);color:var(--on-cur);';
var NXT = 'color:var(--nxt);box-shadow:inset 0 -2px 0 var(--nxt);border-radius:6px 6px 0 0;';
var LINE = 'display:flex;flex-wrap:wrap;align-items:flex-end;padding:4px 10px;border-radius:10px;';
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { i: 5, playing: false, semi: 4, easy: true }; }
  componentDidMount(){ var self = this; this.t = setInterval(function(){ if (self.state.playing) self.setState({ i: (self.state.i + 1) % FLAT.length }); }, 1500); }
  componentWillUnmount(){ clearInterval(this.t); }
  renderVals() {
    var self = this, st = this.state, i = st.i, nx = (i + 1) % FLAT.length, idx = 0;
    var lines = SONG.map(function(ln, li){
      var segs = ln.segs.map(function(sg){
        var k = idx++, c = tr(sg[0], st.semi, st.easy);
        return { c: c, t: sg[1], cstyle: BASE + (k === i ? CUR : (k === nx ? NXT : '')), seek: function(){ self.setState({ i: k }); } };
      });
      return { hasSec: !!ln.sec, sec: ln.sec || '', segs: segs, style: LINE + (FLAT[i].li === li ? 'background:var(--surface2);' : '') };
    });
    var cc = tr(FLAT[i].c, st.semi, st.easy), nc = tr(FLAT[nx].c, st.semi, st.easy);
    var t = 36 + i * 2.2, sec = Math.floor(t % 60);
    return {
      theme: this.props.theme ?? 'auto',
      lines: lines, cur: { c: cc, n: notesOf(cc) }, nxt: { c: nc, n: notesOf(nc) },
      keyShort: NM[(5 + st.semi + 144) % 12] + 'm',
      easyP: st.easy ? 'true' : 'false', fullP: st.easy ? 'false' : 'true',
      playing: st.playing, paused: !st.playing, playLabel: st.playing ? 'Pause' : 'Play',
      time: Math.floor(t / 60) + ':' + (sec < 10 ? '0' : '') + sec, pct: (t / 195 * 100).toFixed(1),
      toggle: function(){ self.setState({ playing: !self.state.playing }); },
      up: function(){ self.setState({ semi: self.state.semi + 1 }); },
      setEasy: function(){ self.setState({ easy: true }); },
      setFull: function(){ self.setState({ easy: false }); }
    };
  }
}
</script>
</body>
</html>
