<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage: play-along</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pc" data-theme="{{theme}}" style="min-height:800px;display:flex;flex-direction:column">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px">
<button class="ibtn" aria-label="Back to songs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="flex:1 1 160px;min-width:0;font-weight:600;font-size:16px">Pal Pal <span class="muted" style="font-weight:400;font-size:13px">· bar {{bar}} of 64</span></div>
<div class="seg" role="group" aria-label="Difficulty"><button aria-pressed="{{easyP}}" onClick="{{setEasy}}">Easy</button><button aria-pressed="{{fullP}}" onClick="{{setFull}}">Full</button></div>
<a class="btn" href="Stage-Edit.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Fix a chord</a>
</header>

<section style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 48px;padding:8px 48px 16px">
<div style="flex:1 1 360px;min-width:0">
<div class="lbl">Now</div>
<div class="mono" style="font-size:168px;line-height:1;font-weight:700;letter-spacing:-0.04em;color:var(--cur)">{{cur.c}}</div>
<div class="muted mono" style="font-size:15px;margin-top:6px">{{cur.names}}</div>
</div>
<div style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:8px;padding-bottom:28px">
<div style="display:flex;align-items:center;gap:10px"><span class="lbl">Next in {{beatsLeft}}</span>
<span style="display:flex;gap:6px" aria-hidden="true"><sc-for list="{{beats}}" as="b" hint-placeholder-count="4"><span style="{{b.style}}"></span></sc-for></span></div>
<div class="mono" style="font-size:96px;line-height:1;font-weight:700;letter-spacing:-0.03em;color:var(--nxt)">{{nxt.c}}</div>
<div class="muted" style="font-size:15px">then <span class="mono" style="font-weight:700">{{then}}</span></div>
</div>
</section>

<section style="padding:0 24px" aria-label="Chord timeline">
<div style="display:flex;gap:4px;overflow:hidden">
<sc-for list="{{ribbon}}" as="r" hint-placeholder-count="10">
<button onClick="{{r.seek}}" style="{{r.style}}"><span class="mono" style="font-weight:700;font-size:18px">{{r.c}}</span><span style="font-size:11px;opacity:.75">bar {{r.bar}}</span></button>
</sc-for>
</div>
</section>

<section style="padding:16px 24px 8px">
<dc-import name="Keyboard" lit="{{cur.n}}" soon="{{nxt.n}}" kh="170" hint-size="100%,170px"></dc-import>
</section>

<section style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 24px;text-align:center">
<div class="seg" role="group" aria-label="Below the piano" style="margin-bottom:6px"><button aria-pressed="true">Lyrics</button><button aria-pressed="false">Bar grid</button></div>
<p style="font-size:28px;line-height:1.3;font-weight:600"><sc-for list="{{kar}}" as="w" hint-placeholder-count="4"><span style="{{w.style}}">{{w.t}}</span></sc-for></p>
<p class="muted" style="font-size:19px">{{nextLine}}</p>
</section>

<footer class="bar" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;padding:12px 20px">
<div style="display:flex;align-items:center;gap:6px">
<button class="ibtn" onClick="{{prev}}" aria-label="Previous chord"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"></path></svg></button>
<button class="ibtn" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width:60px;height:60px;border-radius:50%;background:var(--bar-fg);color:var(--bar)">
<sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></sc-if>
</button>
<button class="ibtn" onClick="{{next}}" aria-label="Next chord"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"></path></svg></button>
</div>
<div style="flex:1 1 260px;display:flex;align-items:center;gap:10px">
<span class="mono" style="font-size:13px">{{time}}</span>
<div style="flex:1;position:relative;height:30px" aria-hidden="true">
<div style="position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)"></div>
<div style="position:absolute;left:17%;width:23%;top:5px;height:20px;border-radius:4px;background:rgba(251,146,60,.2);border-left:2px solid #FB923C;border-right:2px solid #FB923C"></div>
<div style="position:absolute;left:0;width:{{pct}}%;top:13px;height:4px;border-radius:2px;background:var(--bar-fg)"></div>
</div>
<span class="mono muted" style="font-size:13px">3:15</span>
</div>
<button class="btn" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"></path></svg>Loop</button>
<div style="display:flex;align-items:center;gap:2px;border:1px solid rgba(255,255,255,.22);border-radius:11px;padding-left:10px">
<span class="muted" style="font-size:12px">Speed</span>
<button class="ibtn" aria-label="Slower">−</button><span class="mono" style="font-size:14px;min-width:44px;text-align:center">75%</span><button class="ibtn" aria-label="Faster">+</button>
</div>
<div style="display:flex;align-items:center;gap:2px;border:1px solid rgba(255,255,255,.22);border-radius:11px;padding-left:10px">
<span class="muted" style="font-size:12px">Key</span>
<button class="ibtn" onClick="{{down}}" aria-label="Transpose down">−</button><span class="mono" style="font-size:14px;font-weight:700;min-width:44px;text-align:center">{{keyShort}}</span><button class="ibtn" onClick="{{up}}" aria-label="Transpose up">+</button>
<a href="Stage-Transpose.dc.html" class="muted" style="font-size:12px;padding:0 10px;color:var(--bar-muted)">from Fm</a>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":1280,"height":800}}'>
var NM = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var PCS = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function cp(c){ var m = /^([A-G][b#]?)(.*)$/.exec(c); return { r: PCS[m[1]], q: m[2] }; }
function simp(q){ return /^m(?!aj)/.test(q) ? 'm' : (/^dim/.test(q) ? 'dim' : ''); }
function tr(c, s, easy){ var p = cp(c); return NM[(p.r + s + 144) % 12] + (easy ? simp(p.q) : p.q); }
function notesOf(c){ var p = cp(c), q = p.q, root = 53 + ((p.r + 7) % 12);
  var ns = [root, root + (/^m(?!aj)/.test(q) || /dim/.test(q) ? 3 : 4), root + (/dim/.test(q) ? 6 : 7)];
  if (/sus4/.test(q)) ns[1] = root + 5;
  if (/maj7/.test(q)) ns.push(root + 11); else if (/7/.test(q)) ns.push(root + 10);
  return ns.join(','); }
function namesOf(c){ return notesOf(c).split(',').map(function(m){ return NM[m % 12]; }).join(' · '); }
var SONG = [
  { segs: [['Fm','walking down the '],['Db','empty road to'],['Ab','night '],['Eb','']] },
  { segs: [['Fm','streetlights hum a '],['Db','song I used to '],['Ab','know '],['Eb','']] },
  { segs: [['Fm','every step I '],['Dbmaj7','take, the city '],['Ab','slows '],['Eb7','']] },
  { segs: [['Db','hold the moment, '],['Ab','hold it while it '],['Eb','stays']] },
  { segs: [['Fm','little by '],['Db','little the '],['Eb','night gives '],['Fm','way']] }
];
var FLAT = []; SONG.forEach(function(ln, li){ ln.segs.forEach(function(sg){ FLAT.push({ li: li, c: sg[0] }); }); });
var N = FLAT.length;
var TILE = 'flex:1 0 96px;min-height:64px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;padding:6px 12px;border-radius:12px;cursor:pointer;text-align:left;';
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { i: 5, b: 1, playing: false, semi: 4, easy: true }; }
  componentDidMount(){ var self = this; this.t = setInterval(function(){ var s = self.state; if (!s.playing) return;
    if (s.b >= 3) self.setState({ b: 0, i: (s.i + 1) % N }); else self.setState({ b: s.b + 1 }); }, 375); }
  componentWillUnmount(){ clearInterval(this.t); }
  renderVals() {
    var self = this, st = this.state, i = st.i, nx = (i + 1) % N;
    var T = function(k){ return tr(FLAT[((k % N) + N) % N].c, st.semi, st.easy); };
    var ribbon = [];
    for (var k = i - 2; k <= i + 7; k++) { (function(k){
      var kk = ((k % N) + N) % N, past = k < i, now = k === i, nxt = k === i + 1;
      ribbon.push({ c: T(k), bar: 17 + kk,
        style: TILE + (now ? 'border:0;background:var(--cur);color:var(--on-cur);' : nxt ? 'border:2px solid var(--nxt);background:var(--nxt-soft);color:var(--fg);' : past ? 'border:1px solid var(--line);background:transparent;color:var(--muted);' : 'border:1px solid var(--line2);background:var(--surface);color:var(--fg);'),
        seek: function(){ self.setState({ i: kk, b: 0 }); } }); })(k); }
    var beats = [0, 1, 2, 3].map(function(x){ return { style: 'width:12px;height:12px;border-radius:50%;' + (x <= st.b ? 'background:var(--nxt);' : 'border:2px solid var(--line2);') }; });
    var li = FLAT[i].li, start = 0; for (var j = 0; j < li; j++) start += SONG[j].segs.length;
    var kar = SONG[li].segs.map(function(sg, si){ var k = start + si;
      return { t: sg[1] || ' ', style: k < i ? 'color:var(--fg);' : k === i ? 'color:var(--cur);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;' : 'color:var(--muted);' }; });
    var nextLine = SONG[(li + 1) % SONG.length].segs.map(function(s){ return s[1]; }).join('');
    var cc = T(i), nc = T(i + 1);
    var t = 36 + i * 2.2 + st.b * 0.55, sec = Math.floor(t % 60), left = 4 - st.b;
    return {
      theme: this.props.theme ?? 'auto',
      cur: { c: cc, n: notesOf(cc), names: namesOf(cc) }, nxt: { c: nc, n: notesOf(nc) },
      then: T(i + 2) + ', ' + T(i + 3), beats: beats, beatsLeft: left === 1 ? '1 beat' : left + ' beats',
      ribbon: ribbon, kar: kar, nextLine: nextLine, bar: 17 + i,
      keyShort: NM[(5 + st.semi + 144) % 12] + 'm',
      easyP: st.easy ? 'true' : 'false', fullP: st.easy ? 'false' : 'true',
      playing: st.playing, paused: !st.playing, playLabel: st.playing ? 'Pause' : 'Play',
      time: Math.floor(t / 60) + ':' + (sec < 10 ? '0' : '') + sec, pct: (t / 195 * 100).toFixed(1),
      toggle: function(){ self.setState({ playing: !self.state.playing }); },
      prev: function(){ self.setState({ i: (self.state.i - 1 + N) % N, b: 0 }); },
      next: function(){ self.setState({ i: (self.state.i + 1) % N, b: 0 }); },
      up: function(){ self.setState({ semi: self.state.semi + 1 }); },
      down: function(){ self.setState({ semi: self.state.semi - 1 }); },
      setEasy: function(){ self.setState({ easy: true }); },
      setFull: function(){ self.setState({ easy: false }); }
    };
  }
}
</script>
</body>
</html>
