<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage: phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pc" data-theme="{{theme}}" style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden">
<header style="display:flex;align-items:center;gap:6px;padding:8px 8px 4px 4px">
<button class="ibtn" aria-label="Back to songs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="flex:1;min-width:0;font-weight:600;font-size:16px">Pal Pal</div>
<a class="chip" href="Stage-Transpose.dc.html">Key <b class="mono">{{keyShort}}</b></a>
<button class="ibtn" aria-label="Fix a chord"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
</header>
<section style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 20px 12px">
<div><div class="lbl">Now</div><div class="mono" style="font-size:112px;line-height:1;font-weight:700;letter-spacing:-0.04em;color:var(--cur)">{{cur.c}}</div><div class="muted mono" style="font-size:13px;margin-top:4px">{{cur.names}}</div></div>
<div style="text-align:right;padding-bottom:22px"><div class="lbl">Next</div><div class="mono" style="font-size:52px;line-height:1;font-weight:700;color:var(--nxt)">{{nxt.c}}</div>
<div style="display:flex;gap:5px;justify-content:flex-end;margin-top:8px" aria-label="{{beatsLeft}} to next chord"><sc-for list="{{beats}}" as="b" hint-placeholder-count="4"><span style="{{b.style}}"></span></sc-for></div></div>
</section>
<section style="display:flex;gap:4px;padding:0 12px" aria-label="Chord timeline">
<sc-for list="{{ribbon}}" as="r" hint-placeholder-count="5"><button onClick="{{r.seek}}" style="{{r.style}}"><span class="mono" style="font-weight:700;font-size:15px">{{r.c}}</span></button></sc-for>
</section>
<section style="padding:14px 12px 6px"><dc-import name="Keyboard" lit="{{cur.n}}" soon="{{nxt.n}}" kh="128" hint-size="100%,128px"></dc-import></section>
<section style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px 20px;text-align:center">
<p style="font-size:21px;line-height:1.3;font-weight:600"><sc-for list="{{kar}}" as="w" hint-placeholder-count="4"><span style="{{w.style}}">{{w.t}}</span></sc-for></p>
<p class="muted" style="font-size:15px">{{nextLine}}</p>
</section>
<footer class="bar" style="display:flex;flex-direction:column;gap:8px;padding:10px 14px 20px">
<div style="position:relative;height:16px" aria-hidden="true">
<div style="position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)"></div>
<div style="position:absolute;left:17%;width:23%;top:0;height:16px;border-radius:4px;background:rgba(251,146,60,.2);border-left:2px solid #FB923C;border-right:2px solid #FB923C"></div>
<div style="position:absolute;left:0;width:{{pct}}%;top:6px;height:4px;border-radius:2px;background:var(--bar-fg)"></div>
</div>
<div style="display:flex;align-items:center;justify-content:space-between">
<button class="ibtn" aria-pressed="true" aria-label="Loop" style="color:#FB923C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"></path></svg></button>
<button class="ibtn" onClick="{{prev}}" aria-label="Previous chord"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"></path></svg></button>
<button class="ibtn" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width:64px;height:64px;border-radius:50%;background:var(--bar-fg);color:var(--bar)">
<sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></sc-if>
</button>
<button class="ibtn" onClick="{{next}}" aria-label="Next chord"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"></path></svg></button>
<button class="ibtn mono" aria-label="Speed 75 percent" style="font-size:13px;width:52px">75%</button>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":390,"height":844}}'>
var NM = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var PCS = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function cp(c){ var m = /^([A-G][b#]?)(.*)$/.exec(c); return { r: PCS[m[1]], q: m[2] }; }
function simp(q){ return /^m(?!aj)/.test(q) ? 'm' : (/^dim/.test(q) ? 'dim' : ''); }
function tr(c, s, easy){ var p = cp(c); return NM[(p.r + s + 144) % 12] + (easy ? simp(p.q) : p.q); }
function notesOf(c){ var p = cp(c), q = p.q, root = 53 + ((p.r + 7) % 12);
  var ns = [root, root + (/^m(?!aj)/.test(q) || /dim/.test(q) ? 3 : 4), root + (/dim/.test(q) ? 6 : 7)];
  if (/sus4/.test(q)) ns[1] = root + 5;
  if (/maj7/.test(q)) ns.push(root + 11); else if (/7/.test(q)) ns.push(root + 10);
  return ns.join(','); }
function namesOf(c){ return notesOf(c).split(',').map(function(m){ return NM[m % 12]; }).join(' · '); }
var SONG = [
  { segs: [['Fm','walking down the '],['Db','empty road to'],['Ab','night '],['Eb','']] },
  { segs: [['Fm','streetlights hum a '],['Db','song I used to '],['Ab','know '],['Eb','']] },
  { segs: [['Fm','every step I '],['Dbmaj7','take, the city '],['Ab','slows '],['Eb7','']] },
  { segs: [['Db','hold the moment, '],['Ab','hold it while it '],['Eb','stays']] },
  { segs: [['Fm','little by '],['Db','little the '],['Eb','night gives '],['Fm','way']] }
];
var FLAT = []; SONG.forEach(function(ln, li){ ln.segs.forEach(function(sg){ FLAT.push({ li: li, c: sg[0] }); }); });
var N = FLAT.length;
var TILE = 'flex:1 1 0;min-width:0;min-height:48px;display:grid;place-items:center;border-radius:10px;cursor:pointer;';
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { i: 5, b: 1, playing: false, semi: 4, easy: true }; }
  componentDidMount(){ var self = this; this.t = setInterval(function(){ var s = self.state; if (!s.playing) return;
    if (s.b >= 3) self.setState({ b: 0, i: (s.i + 1) % N }); else self.setState({ b: s.b + 1 }); }, 375); }
  componentWillUnmount(){ clearInterval(this.t); }
  renderVals() {
    var self = this, st = this.state, i = st.i;
    var T = function(k){ return tr(FLAT[((k % N) + N) % N].c, st.semi, st.easy); };
    var ribbon = [];
    for (var k = i - 1; k <= i + 3; k++) { (function(k){ var kk = ((k % N) + N) % N;
      ribbon.push({ c: T(k), seek: function(){ self.setState({ i: kk, b: 0 }); },
        style: TILE + (k === i ? 'border:0;background:var(--cur);color:var(--on-cur);' : k === i + 1 ? 'border:2px solid var(--nxt);background:var(--nxt-soft);color:var(--fg);' : k < i ? 'border:1px solid var(--line);background:transparent;color:var(--muted);' : 'border:1px solid var(--line2);background:var(--surface);color:var(--fg);') }); })(k); }
    var beats = [0, 1, 2, 3].map(function(x){ return { style: 'width:10px;height:10px;border-radius:50%;' + (x <= st.b ? 'background:var(--nxt);' : 'border:2px solid var(--line2);') }; });
    var li = FLAT[i].li, start = 0; for (var j = 0; j < li; j++) start += SONG[j].segs.length;
    var kar = SONG[li].segs.map(function(sg, si){ var k = start + si;
      return { t: sg[1] || ' ', style: k < i ? 'color:var(--fg);' : k === i ? 'color:var(--cur);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;' : 'color:var(--muted);' }; });
    var cc = T(i), nc = T(i + 1), t = 36 + i * 2.2, left = 4 - st.b;
    return {
      theme: this.props.theme ?? 'auto',
      cur: { c: cc, n: notesOf(cc), names: namesOf(cc) }, nxt: { c: nc, n: notesOf(nc) },
      beats: beats, beatsLeft: left === 1 ? '1 beat' : left + ' beats', ribbon: ribbon, kar: kar,
      nextLine: SONG[(li + 1) % SONG.length].segs.map(function(s){ return s[1]; }).join(''),
      keyShort: NM[(5 + st.semi + 144) % 12] + 'm',
      playing: st.playing, paused: !st.playing, playLabel: st.playing ? 'Pause' : 'Play',
      pct: (t / 195 * 100).toFixed(1),
      toggle: function(){ self.setState({ playing: !self.state.playing }); },
      prev: function(){ self.setState({ i: (self.state.i - 1 + N) % N, b: 0 }); },
      next: function(){ self.setState({ i: (self.state.i + 1) % N, b: 0 }); }
    };
  }
}
</script>
</body>
</html>
