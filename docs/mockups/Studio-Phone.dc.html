<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio: phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="pc" data-theme="{{theme}}" style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;position:relative">
<header style="display:flex;align-items:center;gap:6px;padding:8px 8px 8px 4px;background:var(--surface);border-bottom:1px solid var(--line)">
<button class="ibtn" aria-label="Back to songs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:16px">Pal Pal</div><div style="font-size:11px;color:var(--unsure);font-weight:600">Unsure 2 of 6</div></div>
<button class="ibtn" onClick="{{undo}}" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
<button class="chip">Next unsure</button>
</header>
<section style="padding:10px 0 10px 12px;background:var(--surface);border-bottom:1px solid var(--line)" aria-label="Chord lane">
<div style="display:flex;gap:4px;overflow:hidden">
<sc-for list="{{lane}}" as="b" hint-placeholder-count="7"><button style="{{b.style}}"><span class="mono" style="font-weight:700;font-size:14px">{{b.c}}</span><span style="font-size:10px;opacity:.8">{{b.sub}}</span></button></sc-for>
</div>
<div style="height:28px;display:flex;align-items:center;gap:1px;margin-top:6px;padding-right:12px" aria-hidden="true"><sc-for list="{{wave}}" as="w" hint-placeholder-count="80"><span style="{{w}}"></span></sc-for></div>
</section>
<main style="flex:1;padding:12px 16px;font-size:16px;line-height:1.3;display:flex;flex-direction:column;gap:6px">
<span class="lbl">Chart</span>
<div style="display:flex;flex-wrap:wrap;align-items:flex-end"><span style="display:inline-flex;flex-direction:column;margin-right:8px"><b class="mono" style="font-size:13px">Am</b><span>streetlights hum a </span></span><span style="display:inline-flex;flex-direction:column;margin-right:8px"><b class="mono" style="font-size:13px">F</b><span>song I used to </span></span><span style="display:inline-flex;flex-direction:column"><b class="mono" style="font-size:13px;color:var(--unsure)">C</b><span>know</span></span></div>
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;padding:4px 8px;margin:0 -8px;border-radius:8px;background:var(--surface2)"><span style="display:inline-flex;flex-direction:column;margin-right:8px"><b class="mono" style="font-size:13px">Am</b><span>every step I </span></span><span style="display:inline-flex;flex-direction:column;margin-right:8px"><b class="mono" style="font-size:13px;padding:0 4px;border-radius:4px;background:var(--fg);color:var(--bg);align-self:flex-start">{{selC}}</b><span>take, the city </span></span><span style="display:inline-flex;flex-direction:column"><b class="mono" style="font-size:13px">C</b><span>slows</span></span></div>
</main>
<section class="card" style="border-radius:24px 24px 0 0;border-bottom:0;padding:10px 16px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -12px 32px rgba(0,0,0,.16)">
<div style="width:40px;height:5px;border-radius:3px;background:var(--line2);align-self:center" aria-hidden="true"></div>
<div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-weight:700;font-size:17px">Bar 26 <span class="mono" style="color:var(--fg)">{{selC}}</span></span><span style="font-size:12px;color:var(--unsure);font-weight:600">48% sure</span></div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">
<sc-for list="{{alts}}" as="a" hint-placeholder-count="4"><button onClick="{{a.pick}}" style="{{a.style}}"><span class="mono" style="font-weight:700;font-size:15px">{{a.c}}</span><span style="font-size:11px;opacity:.75">{{a.p}}</span></button></sc-for>
</div>
<dc-import name="Keyboard" lit="{{selN}}" soon="" kh="60" hint-size="100%,60px"></dc-import>
<div style="display:flex;gap:6px">
<button class="btn" onClick="{{earlier}}" style="flex:1">Earlier</button>
<span class="mono" style="flex:1;display:grid;place-items:center;border-radius:11px;background:var(--surface2);font-size:14px;font-weight:700">{{start}}</span>
<button class="btn" onClick="{{later}}" style="flex:1">Later</button>
</div>
<div style="display:flex;gap:6px"><button class="btn" style="flex:1"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>Hear it</button><button class="btn btn-p" style="flex:1">Apply</button></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":390,"height":844}}'>
var NM = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
var PCS = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function cp(c){ var m = /^([A-G][b#]?)(.*)$/.exec(c); return { r: PCS[m[1]], q: m[2] }; }
function notesOf(c){ var p = cp(c), q = p.q, root = 53 + ((p.r + 7) % 12);
  var ns = [root, root + (/^m(?!aj)/.test(q) || /dim/.test(q) ? 3 : 4), root + (/dim/.test(q) ? 6 : 7)];
  if (/sus4/.test(q)) ns[1] = root + 5;
  if (/maj7/.test(q)) ns.push(root + 11); else if (/7/.test(q)) ns.push(root + 10);
  return ns.join(','); }
var LANE = [['F', 0], ['C', 1], ['G', 0], ['Am', 0], ['SEL', 1], ['C', 0], ['G7', 1]];
var ALTS = [['Fmaj7', '48%'], ['Am', '27%'], ['F', '15%'], ['Dm7', '6%']];
var WAVE = []; for (var w = 0; w < 80; w++) WAVE.push(20 + 70 * Math.abs(Math.sin(w * 0.41 + 1) * Math.cos(w * 0.13)));
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { c: 'Fmaj7', off: 0 }; }
  renderVals() {
    var self = this, st = this.state;
    var lane = LANE.map(function(l, k){ var sel = l[0] === 'SEL';
      return { c: sel ? st.c : l[0], sub: sel ? 'editing' : (l[1] ? 'unsure' : 'bar ' + (22 + k)),
        style: 'flex:none;width:72px;min-height:52px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 8px;border-radius:8px;cursor:pointer;text-align:left;' +
          (sel ? 'border:0;background:var(--fg);color:var(--bg);box-shadow:0 0 0 3px var(--cur);' : l[1] ? 'border:1.5px dashed var(--unsure);background:var(--surface);color:var(--fg);' : 'border:1px solid var(--line2);background:var(--surface2);color:var(--fg);') }; });
    var alts = ALTS.map(function(a){ var on = a[0] === st.c;
      return { c: a[0], p: a[1], pick: function(){ self.setState({ c: a[0] }); },
        style: 'min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;cursor:pointer;' + (on ? 'border:2px solid var(--cur);background:var(--cur-soft);color:var(--fg);' : 'border:1px solid var(--line2);background:var(--surface);color:var(--fg);') }; });
    var t = 60.4 + st.off * 0.1, s = t % 60;
    return {
      theme: this.props.theme ?? 'auto', lane: lane, alts: alts,
      wave: WAVE.map(function(h){ return 'flex:1 1 0;min-width:0;height:' + h.toFixed(0) + '%;border-radius:1px;background:var(--line2);'; }),
      selC: st.c, selN: notesOf(st.c),
      start: Math.floor(t / 60) + ':' + (s < 10 ? '0' : '') + s.toFixed(1),
      earlier: function(){ self.setState({ off: self.state.off - 1 }); },
      later: function(){ self.setState({ off: self.state.off + 1 }); },
      undo: function(){ self.setState({ c: 'Fmaj7', off: 0 }); }
    };
  }
}
</script>
</body>
</html>
